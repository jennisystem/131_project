video:
  input_path: "data/raw/sample_shot10.mp4"
  output_dir: "outputs/sample_shot10"
  resize_width: 960
  start_frame: 20
  end_frame: 66
  frame_stride: 1

roi:
  use_roi: false
  x: 0
  y: 0
  w: 960
  h: 540

preprocess:
  blur_kernel: 5
  use_median_blur: true

detection_mask:
  use_mask: true
  outside_mode: black
  keep_regions:
    - { x: 480, y: 0, w: 220, h: 280 }

hsv_threshold:
  lower: [0, 45, 55]
  upper: [30, 255, 255]

morphology:
  open_kernel: 3
  close_kernel: 7

contour_filter:
  min_area: 2500
  max_area: 22000
  ideal_area: 9000
  min_circularity: 0.22
  min_x: 480
  max_x: 700
  max_y: 280
  min_radius: 35
  max_radius: 95

tracking:
  max_jump_px: 170
  allow_missing_frames: true
  reacquire_after_missing: 4
  trail_length: 70

fitting:
  use_ransac: true
  ransac_iterations: 300
  ransac_threshold_px: 25
  min_inliers: 8

visualization:
  save_debug_every_n_frames: 10
