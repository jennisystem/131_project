video:
  input_path: "data/raw/sample_shot7.mp4"
  output_dir: "outputs/sample_shot7"
  resize_width: 960
  start_frame: 35
  end_frame: 70
  frame_stride: 1

roi:
  use_roi: false
  x: 0
  y: 0
  w: 960
  h: 540

preprocess:
  blur_kernel: 5
  use_median_blur: true

detection_mask:
  use_mask: true
  outside_mode: black
  keep_regions:
    - { x: 520, y: 0, w: 170, h: 260 }

hsv_threshold:
  lower: [2, 45, 45]
  upper: [30, 255, 255]

morphology:
  open_kernel: 3
  close_kernel: 7

contour_filter:
  min_area: 3000
  max_area: 22000
  ideal_area: 13000
  min_circularity: 0.22
  min_x: 520
  max_x: 690
  max_y: 260
  min_radius: 45
  max_radius: 95

tracking:
  max_jump_px: 130
  allow_missing_frames: true
  reacquire_after_missing: 5
  trail_length: 80

fitting:
  use_ransac: true
  ransac_iterations: 300
  ransac_threshold_px: 25
  min_inliers: 8

visualization:
  save_debug_every_n_frames: 10
