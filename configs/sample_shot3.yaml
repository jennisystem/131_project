video:
  input_path: "data/raw/sample_shot3.mp4"
  output_dir: "outputs/sample_shot3"
  resize_width: 960
  start_frame: 61
  end_frame: null
  frame_stride: 1

roi:
  use_roi: false
  x: 0
  y: 0
  w: 960
  h: 540

preprocess:
  blur_kernel: 5
  use_median_blur: true

detection_mask:
  use_mask: true
  outside_mode: black
  keep_regions:
    - {x: 250, y: 0, w: 710, h: 650}

background_suppression:
  use_suppression: true
  mode: black
  lower: [[0, 80, 0], [165, 80, 0]]
  upper: [[20, 255, 115], [179, 255, 115]]
  regions:
    - {x: 250, y: 520, w: 710, h: 130}

hsv_threshold:
  # sample_shot3 uses a red/white ball, so red needs two HSV ranges.
  lower: [[0, 60, 40], [165, 60, 40]]
  upper: [[20, 255, 255], [179, 255, 255]]

morphology:
  open_kernel: 3
  close_kernel: 7

contour_filter:
  min_area: 100
  max_area: 15000
  ideal_area: 6500
  min_circularity: 0.15
  min_x: 250
  max_y: 650
  min_radius: 10
  max_radius: 90

tracking:
  max_jump_px: 220
  allow_missing_frames: true
  reacquire_after_missing: 5
  trail_length: 60

fitting:
  use_ransac: true
  ransac_iterations: 300
  ransac_threshold_px: 20
  min_inliers: 8

visualization:
  save_debug_every_n_frames: 10
