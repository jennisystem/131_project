video:
  input_path: "data/raw/sample_shot9.mp4"
  output_dir: "outputs/sample_shot9"
  resize_width: 960
  start_frame: 0
  end_frame: 21
  frame_stride: 1

roi:
  use_roi: false
  x: 0
  y: 0
  w: 960
  h: 540

preprocess:
  blur_kernel: 5
  use_median_blur: true

detection_mask:
  use_mask: true
  outside_mode: black
  keep_regions:
    - { x: 0, y: 0, w: 900, h: 250 }

hsv_threshold:
  lower: [0, 45, 60]
  upper: [30, 255, 255]

morphology:
  open_kernel: 3
  close_kernel: 7

contour_filter:
  min_area: 500
  max_area: 22000
  ideal_area: 4000
  min_circularity: 0.22
  max_x: 900
  max_y: 260
  min_radius: 20
  max_radius: 95

tracking:
  max_jump_px: 145
  allow_missing_frames: true
  reacquire_after_missing: 4
  trail_length: 50

fitting:
  use_ransac: true
  ransac_iterations: 300
  ransac_threshold_px: 25
  min_inliers: 6

visualization:
  save_debug_every_n_frames: 5
